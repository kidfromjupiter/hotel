name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run Python tests
        run: docker compose -f docker-compose.tests.yml run --build --rm tests

      - name: Clean up test containers
        if: always()
        run: docker compose -f docker-compose.tests.yml down --volumes
