services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # This is what we use to apply migrations for the db
  migrations:
    image: flyway/flyway:11
    depends_on:
      db:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://db:5432/app_db
      - -user=app_user
      - -password=app_password
      - -connectRetries=10
      - -validateMigrationNaming=true
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
  seed:
    image: postgres:17
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: app_password
    volumes:
      - ./db/seed:/seed:ro
    command:
      [
        "psql",
        "-h", "db",
        "-U", "app_user",
        "-d", "app_db",
        "-f", "/seed/seed.sql"
      ]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://app_user:app_password@db:5432/app_db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
